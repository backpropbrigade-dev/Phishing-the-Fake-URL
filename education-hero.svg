<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circles -->
  <circle cx="200" cy="300" r="80" fill="#E0E7FF" opacity="0.3"/>
  <circle cx="800" cy="400" r="100" fill="#E0E7FF" opacity="0.3"/>
  <circle cx="850" cy="700" r="60" fill="#E0E7FF" opacity="0.3"/>
  
  <!-- Decorative elements -->
  <circle cx="420" cy="195" r="8" fill="#4F46E5"/>
  <circle cx="810" cy="350" r="8" fill="#4F46E5"/>
  <line x1="180" y1="280" x2="180" y2="320" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="300" x2="200" y2="300" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/>
  <line x1="920" y1="540" x2="960" y2="580" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/>
  <line x1="920" y1="580" x2="960" y2="540" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Headphones -->
  <ellipse cx="350" cy="290" rx="35" ry="45" fill="#4F46E5" stroke="#312E81" stroke-width="8"/>
  <ellipse cx="350" cy="290" rx="25" ry="35" fill="#FCD34D"/>
  <ellipse cx="450" cy="290" rx="35" ry="45" fill="#4F46E5" stroke="#312E81" stroke-width="8"/>
  <ellipse cx="450" cy="290" rx="25" ry="35" fill="#FCD34D"/>
  <path d="M 350 245 Q 400 200 450 245" stroke="#312E81" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Gear icon -->
  <g transform="translate(500, 310)">
    <circle cx="0" cy="0" r="35" fill="#312E81"/>
    <circle cx="0" cy="0" r="18" fill="#E0E7FF"/>
    <rect x="-8" y="-45" width="16" height="20" fill="#312E81" rx="3"/>
    <rect x="-8" y="25" width="16" height="20" fill="#312E81" rx="3"/>
    <rect x="-45" y="-8" width="20" height="16" fill="#312E81" rx="3"/>
    <rect x="25" y="-8" width="20" height="16" fill="#312E81" rx="3"/>
  </g>
  
  <!-- Light bulb -->
  <g transform="translate(200, 450)">
    <ellipse cx="0" cy="-20" rx="30" ry="40" fill="#FCD34D"/>
    <rect x="-15" y="15" width="30" height="8" fill="#312E81" rx="2"/>
    <rect x="-12" y="25" width="24" height="15" fill="#312E81" rx="3"/>
    <line x1="-50" y1="-40" x2="-35" y2="-30" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/>
    <line x1="-55" y1="-20" x2="-40" y2="-20" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/>
    <line x1="-50" y1="0" x2="-35" y2="-10" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Laptop -->
  <g transform="translate(512, 550)">
    <!-- Screen -->
    <rect x="-220" y="-150" width="440" height="280" fill="#A5B4FC" rx="8"/>
    <rect x="-210" y="-140" width="420" height="260" fill="#E0E7FF" rx="4"/>
    
    <!-- Graduation cap on screen -->
    <g transform="translate(0, -20)">
      <polygon points="-120,-40 120,-40 140,0 -140,0" fill="#312E81"/>
      <ellipse cx="0" cy="0" rx="140" ry="20" fill="#1E1B4B"/>
      <rect x="110" y="0" width="8" height="80" fill="#FCD34D"/>
      <circle cx="114" cy="85" r="8" fill="#FCD34D"/>
    </g>
    
    <!-- Diploma on screen -->
    <g transform="translate(-80, 60)">
      <rect x="0" y="0" width="60" height="80" fill="#E0E7FF" rx="4" transform="rotate(-15 30 40)"/>
      <line x1="10" y1="20" x2="50" y2="20" stroke="#6366F1" stroke-width="2" transform="rotate(-15 30 40)"/>
      <line x1="10" y1="30" x2="50" y2="30" stroke="#6366F1" stroke-width="2" transform="rotate(-15 30 40)"/>
      <line x1="10" y1="40" x2="50" y2="40" stroke="#6366F1" stroke-width="2" transform="rotate(-15 30 40)"/>
    </g>
    
    <!-- Keyboard base -->
    <path d="M -240 130 L -220 150 L 220 150 L 240 130 Z" fill="#A5B4FC"/>
    <rect x="-240" y="130" width="480" height="20" fill="#6366F1"/>
    
    <!-- Keyboard details -->
    <rect x="-220" y="135" width="440" height="10" fill="#4F46E5" rx="2"/>
  </g>
  
  <!-- Video play button -->
  <g transform="translate(280, 580)">
    <rect x="0" y="0" width="80" height="60" fill="#312E81" rx="8"/>
    <polygon points="30,20 30,40 55,30" fill="#E0E7FF"/>
  </g>
  
  <!-- Coffee cup -->
  <g transform="translate(180, 750)">
    <ellipse cx="0" cy="-40" rx="35" ry="10" fill="#1E1B4B"/>
    <path d="M -35 -40 L -30 0 Q -30 15 0 15 Q 30 15 30 0 L 35 -40" fill="#312E81"/>
    <path d="M 35 -20 Q 55 -20 55 0 Q 55 20 35 20" stroke="#312E81" stroke-width="6" fill="none"/>
  </g>
  
  <!-- Books stack -->
  <g transform="translate(750, 750)">
    <rect x="-80" y="-20" width="160" height="25" fill="#FCD34D" rx="3"/>
    <rect x="-75" y="-50" width="150" height="25" fill="#F59E0B" rx="3"/>
    <rect x="-70" y="-75" width="140" height="25" fill="#FCD34D" rx="3"/>
  </g>
  
  <!-- Document with pencil -->
  <g transform="translate(850, 450)">
    <rect x="0" y="0" width="100" height="130" fill="#C7D2FE" rx="6"/>
    <line x1="15" y1="25" x2="85" y2="25" stroke="#6366F1" stroke-width="3"/>
    <line x1="15" y1="45" x2="85" y2="45" stroke="#6366F1" stroke-width="3"/>
    <line x1="15" y1="65" x2="85" y2="65" stroke="#6366F1" stroke-width="3"/>
    <line x1="15" y1="85" x2="60" y2="85" stroke="#6366F1" stroke-width="3"/>
    <path d="M 70 90 L 90 110" stroke="#312E81" stroke-width="8" stroke-linecap="round"/>
    <polygon points="88,108 92,112 98,106" fill="#FCD34D"/>
    <circle cx="95" cy="115" r="8" fill="#F59E0B"/>
  </g>
  
  <!-- Gear icon bottom right -->
  <g transform="translate(800, 620)">
    <circle cx="0" cy="0" r="28" fill="#312E81"/>
    <circle cx="0" cy="0" r="14" fill="#E0E7FF"/>
    <rect x="-6" y="-36" width="12" height="16" fill="#312E81" rx="2"/>
    <rect x="-6" y="20" width="12" height="16" fill="#312E81" rx="2"/>
    <rect x="-36" y="-6" width="16" height="12" fill="#312E81" rx="2"/>
    <rect x="20" y="-6" width="16" height="12" fill="#312E81" rx="2"/>
  </g>
  
  <!-- Progress bar -->
  <g transform="translate(512, 770)">
    <rect x="-200" y="0" width="400" height="30" fill="#E0E7FF" rx="15"/>
    <rect x="-200" y="0" width="320" height="30" fill="#FCD34D" rx="15"/>
  </g>
</svg>
